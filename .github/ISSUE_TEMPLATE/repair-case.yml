name: Real repair case
description: Document a physical repair, including failed prints and fit measurements.
title: "Repair case: "
labels: [repair-case]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing GhostPart on a real object. Share only images you have permission to publish. Remove faces, addresses, financial cards, and other personal details. Safety-critical repairs are out of scope.
  - type: input
    id: object
    attributes:
      label: What broke?
      placeholder: e.g. a drawer mounting plate
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Independent measurements
      description: Include target hole spacing, the printed marker side, and the tool used (calipers or ruler), all in millimetres. Record the values before looking at the app's estimate.
    validations:
      required: true
  - type: textarea
    id: preflight
    attributes:
      label: Phone accuracy check
      description: Report the five-photo card result from PRETEST.md, including blocked scans and the range of reported spans. Include phone, browser, and whether auto marker detection worked.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: GhostPart design
      description: Include generated dimensions and, if possible, the editable OpenSCAD file or a link.
    validations:
      required: true
  - type: textarea
    id: fabrication
    attributes:
      label: Print and fit result
      description: State printer, material, settings, clearance coupon choice, number of prints, physically measured spacing of each print, and whether each print fit. Failed attempts matter.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Photos or video
      description: Add before, measurement, print, and installed-part images if you can share them.
